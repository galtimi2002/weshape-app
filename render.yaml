services:
  - type: web
    name: weshape-app
    runtime: static
    buildCommand: bash tool/render_build.sh
    staticPublishPath: build/web
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        value: https://api.weshapeenergy.com
      - key: AUTH_MODE
        value: firebase
    routes:
      # Firebase's sign-in helper, served from our own domain so Google's
      # account picker says "continue to weshapeenergy.com" rather than
      # weshape-energy.firebaseapp.com. Must stay above the catch-all.
      - type: rewrite
        source: /__/auth/*
        destination: https://weshape-energy.firebaseapp.com/__/auth/*
      - type: rewrite
        source: /__/firebase/*
        destination: https://weshape-energy.firebaseapp.com/__/firebase/*
      # Single-page app: every other path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Flutter's own loader and the service worker must never be cached stale.
      - path: /flutter_bootstrap.js
        name: Cache-Control
        value: no-cache
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
