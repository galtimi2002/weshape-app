name: weshape_app
description: "WeShape Energy. We care about the future of green energy."
publish_to: 'none'
version: 0.1.0+1

# Same floor as Inventica: the theme uses CardThemeData / DialogThemeData.
environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

  # Home map: MapLibre GL JS runs in the page (assets/map/weshape_map.js);
  # package:web lets Flutter host it.
  web: ^1.0.0

  # Auth (used with --dart-define=AUTH_MODE=firebase)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/map/
