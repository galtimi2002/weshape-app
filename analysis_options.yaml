include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/core/i18n/country_names.g.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
    prefer_const_constructors: true
    avoid_print: true
